name: daily tips update

on:
  schedule:
    # Hong Kong time = UTC+8. Morning fetch (after overnight news) and
    # pre-race fetch on race-day evenings (Wed/Sat/Sun meetings).
    - cron: "30 0 * * *"
    - cron: "0 11 * * 3,6,0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-tips
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas requests

      - name: Fetch tips
        run: python scripts/auto_fetch.py

      - name: Commit data
        run: |
          git config user.name "sporttips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "auto: daily tips update $(date -u +%F)"
            git push
          fi
