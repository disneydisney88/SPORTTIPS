name: test fetch
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas
      - name: probe
        run: |
          python - << 'PY'
          import requests
          for name, url in [("direct", "https://www.stheadline.com/rss"),
                            ("jina", "https://r.jina.ai/https://www.stheadline.com/rss"),
                            ("allorigins", "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.stheadline.com%2Frss")]:
              try:
                  r = requests.get(url, timeout=25, headers={"User-Agent": "Mozilla/5.0"})
                  ok = r.status_code
                  has_item = "<item>" in r.text or "<item " in r.text
                  print(name, ok, "items:", has_item, "len:", len(r.text))
              except Exception as e:
                  print(name, "ERR", str(e)[:100])
          PY
      - name: collect rows
        run: |
          python - << 'PY'
          import sys; sys.path.insert(0, '.')
          from sporttips import tip_sources
          df = tip_sources.collect_news_tips(days=3)
          print("tip rows:", len(df))
          PY
